name: Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: Run Selenium Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # No browser/driver install step needed: GitHub-hosted ubuntu-latest
      # runners ship with Chrome preinstalled, and Selenium Manager
      # (bundled in Selenium.WebDriver) downloads a matching chromedriver
      # automatically on first run.
      - name: Run Selenium tests
        run: >
          dotnet test --no-build
          --logger "trx;LogFileName=selenium-test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: ./TestResults
